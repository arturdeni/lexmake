/* ===== Lexmake × estructura huyml — solo lo nuevo; el resto es el CSS original ===== */
@font-face{font-family:"Gallery";src:url(fonts/Gallery-Italic.otf) format("opentype");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Gallery";src:url(fonts/Gallery.otf) format("opentype");font-weight:400;font-style:normal;font-display:swap}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--color-grey);color:var(--color-black)}
#app{transition:opacity .45s ease}
#app.fading{opacity:0}

/* micro-tipografía de la referencia: 10px / 13px, medium */
.lx-s{font-family:var(--font-hanken);font-size:10px;line-height:13px;font-weight:500;letter-spacing:.1px}
.lx-mute{color:rgba(0,0,0,.5)}

/* animación de entrada original (fade + y) */
[data-fx]{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.33,1,.68,1),transform .8s cubic-bezier(.33,1,.68,1)}
[data-fx].in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){[data-fx]{opacity:1;transform:none;transition:none}}

/* ---------- HOME · trabajos (estructura huyml) ---------- */
.lx-work{background:var(--color-grey);position:relative;z-index:10;margin-top:-300px}
.lx-work .portfolio-cta__header{max-width:var(--max-width);margin:0 auto;padding:var(--spacing-xl) var(--container-padding) 0}
.home-skills.lx-after{margin-top:0}
.lx-show{position:relative}
.lx-stick{position:sticky;top:0;height:100vh;overflow:hidden;perspective:1400px}
.lx-stage{position:absolute;inset:0}
.lx-card{position:absolute;left:49.2%;top:50.5%;width:23.7vw;max-width:420px;aspect-ratio:1.235;display:block;will-change:transform,opacity;cursor:url(img/ui/BLANCO.svg) 32 32,pointer;backface-visibility:hidden}
.lx-card img{width:100%;height:100%;object-fit:cover;display:block;background:#d9d9d9;box-shadow:-6px 0 0 rgba(0,0,0,.04)}
.lx-info{position:absolute;left:0;top:41.6%;display:grid;grid-template-columns:repeat(2,auto);gap:68px 0;z-index:3}
.lx-pair{display:grid;grid-template-columns:54px 1fr;padding-left:20px;min-width:178px}
.lx-pair.c2{grid-template-columns:90px 1fr;padding-left:0;min-width:240px}
.lx-pair a{color:var(--color-black);text-decoration:underline;text-underline-offset:2px}
.lx-sel{position:absolute;left:13.75vw;bottom:24px;z-index:4;display:flex;align-items:flex-start;gap:12px;pointer-events:none;color:var(--color-black)}
.lx-num{font-family:var(--font-hanken);font-weight:300;font-size:180px;line-height:153px;letter-spacing:-7.2px;height:153px;overflow:hidden;display:block;font-variant-numeric:tabular-nums}
.lx-num span{display:block;transition:transform .6s cubic-bezier(.65,0,.35,1)}
.lx-sel .lx-s{margin-top:8px}
.lx-list{position:absolute;left:80vw;top:0;width:246px;margin-left:-123px;z-index:3;will-change:transform}
.lx-item{height:173px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;opacity:.28;transition:opacity .45s ease;cursor:pointer;background:none;border:0;padding:0;width:100%;color:inherit;font-family:var(--font-hanken);font-size:10px;line-height:13px;font-weight:500;letter-spacing:.1px}
.lx-item.on{opacity:1}
.lx-item:hover{opacity:.7}.lx-item.on:hover{opacity:1}
.lx-list .lx-item span.cat{font-size:10px!important;color:rgba(31,31,31,.52)}
.lx-item .t{font-family:var(--font-hanken);font-weight:500;font-size:16px;line-height:16px;letter-spacing:.16px;text-transform:uppercase;margin-top:6px}
.lx-item .d{width:12px;height:1px;background:currentColor;margin:16px 0 20px}
.lx-sw{position:absolute;right:20px;top:50%;display:flex;gap:6px;z-index:3;transform:translateY(-50%)}
.lx-sw i{width:12px;height:12px;display:block;transition:background .5s}
.lx-foot{position:absolute;left:20px;right:20px;bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;z-index:3}
.lx-foot .view-more-link{font-size:20px}
.lx-mobinfo{display:none}
@media (max-width:768px){
  .lx-work{margin-top:-200px}
  .lx-card{left:50%;top:42%;width:72vw;max-width:none}
  .lx-info,.lx-list,.lx-sw{display:none}
  .lx-sel{left:var(--container-padding);top:84px;bottom:auto}
  .lx-num{font-size:84px;line-height:72px;height:72px;letter-spacing:-3px}
  .lx-mobinfo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;position:absolute;left:24px;right:24px;bottom:76px;z-index:120}
  .lx-mobinfo .t{font-family:var(--font-hanken);font-weight:500;font-size:16px;text-transform:uppercase}
  .lx-mobinfo .sw{display:flex;gap:6px}.lx-mobinfo .sw i{width:12px;height:12px;display:block}
  .lx-foot .lx-s:first-child{display:none}
}

/* ---------- PROYECTO (estructura huyml) ---------- */
.lx-intro{height:100vh;background:#0c0c0c;color:#fff;display:grid;place-items:center;position:relative;z-index:20;padding:0 var(--container-padding)}
.lx-intro h1{margin:0;font-family:var(--font-hanken);font-weight:500;font-size:var(--h2-size);line-height:var(--h2-line-height);text-transform:uppercase;text-align:center;overflow:hidden}
.lx-intro h1 span{display:block;transition:transform 1s cubic-bezier(.33,1,.68,1)}
.lx-intro.pre h1 span{transform:translateY(105%)}
.lx-pj{display:grid;grid-template-columns:27.5vw 45vw 27.5vw;position:relative}
.lx-aside{position:sticky;top:0;height:100vh;align-self:start}
.lx-aside .blk{position:absolute;left:20px;top:39.4vh;width:calc(27.5vw - 40px);display:grid;gap:22px}
.lx-aside .row{display:grid;grid-template-columns:104px 1fr;align-items:start}
.lx-aside .row2{display:grid;grid-template-columns:104px auto 1fr;column-gap:16px}
.lx-aside .about{max-width:210px}
.lx-visit{color:var(--color-black);text-decoration:none;font-family:var(--font-hanken);font-weight:500;font-size:16px;line-height:16px;margin-left:104px;display:inline-flex;gap:6px;width:max-content;transition:opacity .3s}
.lx-visit:hover{opacity:.55}
.lx-aside .bot{position:absolute;left:20px;bottom:20px;display:flex;gap:10px}
.lx-imgs{display:flex;flex-direction:column;gap:85px;padding:46.6vh 0 22vh}
.lx-imgs figure{margin:0;width:100%;background:#dcdcdc;overflow:hidden}
.lx-imgs img{width:100%;height:auto;display:block}
.lx-map{position:sticky;top:0;height:100vh;align-self:start;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:7px;padding-right:47px}
.lx-map button{width:43px;height:31px;padding:0;border:0;background:#ddd;opacity:.35;transition:opacity .3s;cursor:pointer;overflow:hidden}
.lx-map button.on,.lx-map button:hover{opacity:1}
.lx-map img{width:100%;height:100%;object-fit:cover;display:block}
.lx-next{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 var(--container-padding);text-decoration:none;color:var(--color-black)}
.lx-next b{font-family:var(--font-hanken);font-weight:500;font-size:clamp(56px,8.4vw,120px);line-height:1;text-transform:uppercase;letter-spacing:-.01em;transition:opacity .3s}
.lx-next:hover b{opacity:.6}
.lx-next .it{font-family:var(--font-hanken);font-style:normal;font-weight:500;font-size:10px;line-height:13px;letter-spacing:.1px;color:rgba(0,0,0,.5)}
@media (max-width:900px){
  .lx-pj{grid-template-columns:1fr;padding:0 var(--container-padding)}
  .lx-aside{position:relative;height:auto}
  .lx-aside .blk{position:static;width:auto;padding:110px 0 40px}
  .lx-aside .bot,.lx-map{display:none}
  .lx-imgs{padding:0 0 60px;gap:24px}
  .lx-aside .row,.lx-aside .row2{grid-template-columns:90px 1fr}
  .lx-visit{margin-left:90px}
}

/* descripciones más pequeñas */
.lx-list .lx-item span.ds{display:block;font-size:10px!important;line-height:13px!important;font-weight:500;letter-spacing:.1px;max-width:246px;color:#000}
.lx-aside .about{font-size:10px;line-height:13px;font-weight:500;letter-spacing:.1px;max-width:210px}

/* todo en Hanken Light */

    <div class="lx-list">${list.map((p,i)=>`<div role="button" tabindex="0" class="lx-item lx-s" data-j="${i}"><span class="cat">${esc(p.c.join(', '))}</span><span class="t">${esc(p.n)}</span><span class="d"></span><span class="ds">${esc(p.d)}</span></div>`).join('')}</div>
    <div class="lx-sw"><i></i><i></i><i></i></div>
    <div class="lx-mobinfo lx-s"><span class="lx-mute cat"></span><span class="t"></span><div class="sw"><i></i><i></i><i></i></div></div>
    <div class="lx-foot"><span class="lx-s lx-mute">Scroll</span><a href="#portfolio" class="view-more-link">Ver todos</a></div>
  </div>`;
  const cards=$$('.lx-card',el), items=$$('.lx-item',el), info=$('.lx-info',el), num=$('.lx-num span',el), list_=$('.lx-list',el), sw=$$('.lx-sw i, .lx-mobinfo .sw i',el), mob=$('.lx-mobinfo',el);
  let cur=0, act=-1;
  const set=i=>{
    const p=list[i]; act=i;
    info.innerHTML=`<div class="lx-pair"><span class="lx-mute">Servicios</span><span>${p.c.map(esc).join('<br>')}</span></div>
      <div class="lx-pair c2"><span class="lx-mute">Sector</span><span>${esc(p.sec)}</span></div>
      <div class="lx-pair"></div>
      <div class="lx-pair c2"><span class="lx-mute">Estudio</span><span>Lexmake, Barcelona${p.url?`<br><a href="${p.url}" target="_blank" rel="noopener">${esc(p.url.replace(/^https?:\/\/(www\.)?/,''))}</a>`:''}</span></div>`;
    if(reduce){num.textContent=pad(i+1);}
    else{num.style.transform='translateY(-100%)';setTimeout(()=>{num.textContent=pad(i+1);num.style.transition='none';num.style.transform='translateY(100%)';void num.offsetHeight;num.style.transition='';num.style.transform='';},300);}
    items.forEach((b,k)=>b.classList.toggle('on',k===i));
    $('.cat',mob).textContent=p.c.join(', '); $('.t',mob).textContent=p.n;
    palette(cover(p.s)).then(c=>{if(act===i) sw.forEach((d,k)=>d.style.background=c[k%3]);});
  };
  const jump=j=>{const top=scrollY+el.getBoundingClientRect().top, span=el.offsetHeight-innerHeight; scrollTo({top:top+span*(j/(n-1)),behavior:reduce?'auto':'smooth'});};
  items.forEach(b=>{const go=()=>{const j=+b.dataset.j; if(Math.abs(j-cur)<.5) location.hash=list[j].s; else jump(j);}; b.addEventListener('click',go); b.addEventListener('keydown',e=>{if(e.key==='Enter')go();});});
  cards.forEach(c=>c.addEventListener('click',e=>{const i=+c.dataset.i;if(Math.abs(i-cur)>.5){e.preventDefault();jump(i);}}));
  const tick=()=>{
    const r=el.getBoundingClientRect(), span=el.offsetHeight-innerHeight;
    if(r.bottom<-50||r.top>innerHeight+50) return;
    const target=clamp(-r.top/span,0,1)*(n-1);
    cur=reduce?target:lerp(cur,target,.09);
    const vw=innerWidth/100, vh=innerHeight/100, m=innerWidth<=768;
    cards.forEach((c,i)=>{
      // geometría medida en huyml: anterior arriba-dcha (+10vw,-38vh), siguiente abajo-izq (-19vw,+55vh),
      // el resto apiladas detrás como un mazo
      const a=i-cur, ab=Math.abs(a), t=Math.min(ab,1), extra=Math.max(0,ab-1);
      let x,y,rz,ry;
      if(a<0){ x=(m?16:10.2)*vw*t + extra*(m?12:30); y=-(m?48:45)*vh*t - extra*(m?10:22); }
      else   { x=-(m?22:19)*vw*t - extra*(m?12:30); y=(m?64:55)*vh*t + extra*(m?10:22); }
      rz=1+t*4.5+Math.min(extra,3)*1.2; ry=-6+t*(a<0?-8:8);
      const z=-t*40-Math.min(extra,5)*30;
      c.style.transform=`translate(-50%,-50%) perspective(1400px) translate3d(${x}px,${y}px,${z}px) rotateY(${ry}deg) rotateZ(${rz}deg)`;
      c.style.opacity=extra>4?0:1;
      c.style.zIndex=100-Math.round(ab*10);
    });
    // lista derecha: el activo queda a la altura de la imagen central
    list_.style.transform=`translateY(${innerHeight*.5-50-cur*173}px)`;
    const i=clamp(Math.round(cur),0,n-1); if(i!==act) set(i);
  };
  set(0);
  return {el,tick};
}

// título del hero: efecto máquina de escribir, letra a letra con cursor
function heroTitle(){
  const h=$('.hero__title'); if(!h) return;
  const chars=[];
  const wrap=(txt)=>[...txt].map(ch=>`<span class="tc">${ch===' '?' ':esc(ch)}</span>`).join('');
  $$('.hero__title-line',h).forEach(line=>{
    const out=[];
    line.childNodes.forEach(n=>{
      if(n.nodeType===3){ const t=n.textContent.replace(/\s+/g,' '); if(t.trim()||out.length) out.push(wrap(t)); }
      else if(n.classList&&n.classList.contains('hero__title-line--cursive')) out.push(`<span class="hero__title-line--cursive" data-astro-cid-ocrortkz>${wrap(n.textContent)}</span>`);
    });
    line.innerHTML=out.join('').replace(/^(<span class="tc"> <\/span>)+|(<span class="tc"> <\/span>)+$/g,'');
  });
  const hero=h.closest('.hero'); hero.classList.add('lx-ty');
  const cs=$$('.tc',h), caret=document.createElement('span'); caret.className='lx-caret';
  if(reduce){cs.forEach(c=>c.classList.add('on'));hero.classList.add('typed');return;}
  let i=0;
  const step=()=>{
    if(i>=cs.length){ hero.classList.add('typed'); setTimeout(()=>caret.classList.add('bye'),1600); return; }
    const c=cs[i++]; c.classList.add('on'); c.after(caret);
    const ch=c.textContent, last=c.parentElement!==cs[i]?.parentElement;
    setTimeout(step, ch===' '?45: last?70 : 16+Math.random()*22);
  };
  cs[0].before(caret);
  setTimeout(step,window.__lxIntro?1650:200);
}

// efecto máquina de escribir para cualquier título (mantiene cursivas y saltos de línea)
function typeTitle(el,delay){
  if(!el) return;
  const walk=n=>{ [...n.childNodes].forEach(c=>{
    if(c.nodeType===3){ const t=c.textContent.replace(/\s+/g,' '); if(!t.trim()&&!t.length) return;
      const f=document.createDocumentFragment(); [...t].forEach(ch=>{const sp=document.createElement('span');sp.className='tc';sp.textContent=ch;f.appendChild(sp);}); c.replaceWith(f); }
    else if(c.nodeType===1&&c.tagName!=='BR') walk(c); }); };
  walk(el); el.classList.add('lx-ty');
  const cs=$$('.tc',el).filter(c=>!(c.textContent===' '&&(!c.previousElementSibling||c.previousElementSibling.tagName==='BR')));
  if(reduce){cs.forEach(c=>c.classList.add('on'));$$('.tc',el).forEach(c=>c.classList.add('on'));return;}
  $$('.tc',el).forEach(c=>{ if(!cs.includes(c)) c.classList.add('on'); });
  const caret=document.createElement('span'); caret.className='lx-caret'; cs[0].before(caret); let i=0;
  const step=()=>{ if(i>=cs.length){setTimeout(()=>caret.classList.add('bye'),1400);return;}
    const c=cs[i++]; c.classList.add('on'); c.after(caret); setTimeout(step,c.textContent===' '?45:16+Math.random()*22); };
  setTimeout(step,delay);
}
